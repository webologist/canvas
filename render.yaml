# Render blueprint: the Django API and its Postgres database. The frontend stays on Vercel, which proxies
# /api, /media, /admin and /static to this service (see frontend/vercel.json).
# Free plans: no disk, so media (fonts, template images) is re-created on every start, and the free
# database expires after 30 days. For anything lasting use paid plans plus a disk or S3 (USE_S3).
# Create it in Render: New > Blueprint > pick this repo. Change SITE_URL below if your Vercel address differs.
services:
  - type: web
    name: canvas-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /api/v1/health/
    envVars:
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        fromDatabase:
          name: canvas-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: SITE_URL
        value: https://canvas-rho-bice.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://canvas-rho-bice.vercel.app
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com,canvas-rho-bice.vercel.app
      - key: WEB_CONCURRENCY
        value: "1"
      - key: SERVE_MEDIA
        value: "true"
      - key: DOORY_SYNC_FONTS
        value: "true"
      - key: DOORY_SEED_TEMPLATES
        value: "true"

databases:
  - name: canvas-db
    plan: free
    databaseName: doory
